name: Validate infrastructure code

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible Core & Collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install ansible.windows microsoft.ad

      - name: Syntax-check playbooks
        run: |
          if find playbooks -name "*.yml" -o -name "*.yaml" | grep -q .; then
            find playbooks -type f \( -name "*.yml" -o -name "*.yaml" \) -print0 | xargs -0 -n1 ansible-playbook --syntax-check
          else
            echo "No playbooks found; nothing to syntax-check."
          fi
